# Loki mono-instance pour la condition A. Réglages modifiés par rapport aux
# valeurs par défaut : accepter des entrées anciennes (données rejouées) et
# un débit d'ingestion élevé (environ 13 millions de lignes à charger).
auth_enabled: false

server:
  http_listen_port: 3100
  # 4 Mo par défaut : un lot de lignes Train Ticket (traces de pile Java)
  # atteignait 9,7 Mo et était refusé.
  grpc_server_max_recv_msg_size: 67108864
  grpc_server_max_send_msg_size: 67108864

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 64MB
  per_stream_rate_limit_burst: 128MB
  max_query_series: 5000
  allow_structured_metadata: false

# Les lignes restent en mémoire (ingester) jusqu'à leur écriture sur disque ;
# pour des horodatages anciens, elles ne deviennent interrogeables qu'une fois
# écrites ET l'index publié (quelques minutes). chunk_idle_period court =
# écriture rapide après le chargement. Constaté : sans attendre, 1 service sur
# 11 visible ; après quelques minutes, 100 % des lignes. Le chargeur vérifie
# ce point (python -m src.causal.condition_a --check).
ingester:
  chunk_idle_period: 2m
  max_chunk_age: 2h
  # Journal de reprise DANS le volume persistant : sinon, les lignes pas
  # encore écrites sur disque sont perdues au moindre redémarrage (constaté).
  wal:
    enabled: true
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
  retention_enabled: false

analytics:
  reporting_enabled: false
