# Loki mono-instance du banc PipeFault, ingestion OTLP depuis le Collector
# (http://loki:3100/otlp). Données en direct : pas besoin d'accepter des
# entrées anciennes, contrairement à study/condition_a/loki.yaml.
# allow_structured_metadata est requis par l'ingestion OTLP de Loki 3.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  max_query_series: 5000
  retention_period: 0s

ingester:
  wal:
    enabled: true
    dir: /loki/wal

compactor:
  working_directory: /loki/compactor
  retention_enabled: false

analytics:
  reporting_enabled: false
