# Configuration complémentaire du Collector de la démo, passée comme
# OTEL_COLLECTOR_CONFIG_EXTRAS (chargée après otelcol-config.yml, dont elle
# remplace les listes d'exporteurs des pipelines). Envoie traces -> Jaeger,
# métriques -> Prometheus (récepteur OTLP), journaux -> Loki (OTLP natif).
exporters:
  otlp_grpc/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
  otlp_http/prometheus:
    endpoint: "http://prometheus:9090/api/v1/otlp"
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      exporters: [otlp_grpc/jaeger, span_metrics]
    metrics:
      exporters: [otlp_http/prometheus]
    logs:
      exporters: [otlp_http/loki]
